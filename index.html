<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME POS Online</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#15171b}button,input,select{font:inherit}.hide{display:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111318}.box,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.box{width:min(420px,100%);padding:24px}.box h1{margin:0 0 8px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d9dde4;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.primary{background:#111318;color:white}.light{background:#eef1f5}.danger{background:#fff0ee;color:#a72820}.app{min-height:100vh}.top{position:sticky;top:0;z-index:2;background:#111318;color:#fff;padding:12px;display:flex;align-items:center;gap:10px;overflow:auto}.top b{white-space:nowrap}.nav{display:flex;gap:6px}.nav button{background:#262a33;color:#fff;border:0;border-radius:8px;padding:8px 10px;white-space:nowrap}.nav button.active{background:#fff;color:#111}.wrap{padding:14px;max-width:1200px;margin:auto}.page{display:none}.page.active{display:block}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi b{display:block;font-size:24px;margin-top:5px}.muted{color:#6b7280;font-size:12px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary{font-size:14px}.summary div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #ddd}.summary .total{font-size:20px;font-weight:800;border:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{padding:9px;border:1px solid #ddd;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow:auto}.pill{font-size:11px;border-radius:999px;background:#eef1f5;padding:4px 7px}.svc{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #e5e7eb;border-radius:8px;margin:6px 0}.svc span{margin-left:auto;color:#6b7280}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.right{margin-left:auto}.mini{padding:6px 8px;font-size:12px}.editgrid{display:grid;grid-template-columns:1fr 1fr 1fr 110px 90px;gap:6px;align-items:center;margin-bottom:6px}.editgrid input{padding:7px;border:1px solid #ddd;border-radius:7px;width:100%}@media(max-width:720px){.kpis,.row,.row3{grid-template-columns:1fr 1fr}.editgrid{grid-template-columns:1fr 1fr}.editgrid .wide{grid-column:1/-1}.top{align-items:flex-start;flex-wrap:wrap}.nav{width:100%;overflow:auto}.right{margin-left:0}}@media(max-width:480px){.kpis,.row,.row3{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>FRAME POS</h1><div class="muted">Online + Supabase Sync</div><div class="field"><label>Email</label><input id="u" type="email" placeholder="name@example.com"></div><div class="field"><label>Password</label><input id="p" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"></div><button class="btn primary" style="width:100%" onclick="login()">เข้าสู่ระบบ</button><button class="btn light" style="width:100%;margin-top:8px" onclick="signup()">สมัครบัญชีครั้งแรก</button><div id="err" class="muted" style="color:#b42318;margin-top:8px"></div><div class="muted" style="margin-top:12px">บัญชีแรกที่สมัครจะเป็น Admin อัตโนมัติ</div></div></div>
<div id="app" class="app hide"><div class="top"><b>FRAME POS</b><div class="nav"><button data-p="dash" class="active">Dashboard</button><button data-p="new">รับงาน</button><button data-p="jobs">งานทั้งหมด</button><button data-p="members">สมาชิก</button><button data-p="catalog">สินค้า & ราคา</button></div><button class="btn light mini right" onclick="logout()">ออก</button></div><div class="wrap">
<section id="dash" class="page active"><div class="grid kpis"><div class="card kpi"><span class="muted">งานทั้งหมด</span><b id="kJobs">0</b></div><div class="card kpi"><span class="muted">กำลังผลิต</span><b id="kProd">0</b></div><div class="card kpi"><span class="muted">สมาชิก</span><b id="kMem">0</b></div><div class="card kpi"><span class="muted">ยอดขาย</span><b id="kSales">฿0</b></div></div><div class="card section"><h2>งานล่าสุด</h2><div id="recent" class="scroll"></div></div></section>
<section id="new" class="page"><div class="row"><div class="card"><h2>รับงานใหม่</h2><div class="field"><label>สมาชิก</label><select id="nCustomer"></select></div><div class="row"><div class="field"><label>กว้าง (cm)</label><input id="nW" type="number" value="40" oninput="calc()"></div><div class="field"><label>สูง (cm)</label><input id="nH" type="number" value="60" oninput="calc()"></div></div><div class="field"><label>กรอบ</label><select id="nFrame" onchange="calc()"></select></div><div class="row3"><div class="field"><label>กระจก</label><select id="nGlass" onchange="calc()"><option value="0|Normal Glass">Normal Glass +฿0</option><option value="350|UV Glass">UV Glass +฿350</option><option value="600|Museum Glass">Museum Glass +฿600</option></select></div><div class="field"><label>Mat</label><select id="nMat" onchange="calc()"><option value="0|None">ไม่ใช้ +฿0</option><option value="200|Standard Mat">Standard +฿200</option><option value="350|Premium Mat">Premium +฿350</option></select></div><div class="field"><label>Backing</label><select id="nBack" onchange="calc()"><option value="0|Standard">Standard +฿0</option><option value="180|Foam Board">Foam Board +฿180</option></select></div></div><div class="section"><b>บริการเพิ่มเติม</b><div id="serviceList"></div></div><div class="field"><label>หมายเหตุ</label><input id="nNotes" placeholder="รายละเอียดงาน"></div></div><div class="card"><h2>ราคา & นัดรับ</h2><div id="priceBox" class="summary"></div><div class="field"><label>ส่วนลด (บาท)</label><input id="nDisc" type="number" value="0" oninput="calc()"></div><div class="field"><label>มัดจำ (บาท)</label><input id="nDep" type="number" value="0" oninput="calc()"></div><div class="field"><label>วันที่รับ</label><input id="nDue" type="datetime-local"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="createJob()">เปิด Job</button></div></div></section>
<section id="jobs" class="page"><div class="card"><h2>งานทั้งหมด</h2><div class="toolbar"><input id="jobSearch" placeholder="ค้นหา Job / ชื่อลูกค้า" oninput="renderJobs()"></div><div id="jobsTable" class="scroll"></div></div></section>
<section id="members" class="page"><div class="row"><div class="card"><h2>เพิ่มสมาชิก</h2><div class="field"><label>ชื่อ</label><input id="mName"></div><div class="field"><label>โทรศัพท์</label><input id="mPhone"></div><div class="field"><label>Email</label><input id="mEmail"></div><div class="field"><label>ระดับ</label><select id="mTier"><option>Regular</option><option>Silver</option><option>Gold</option><option>VIP</option></select></div><div class="field"><label>หมายเหตุ</label><input id="mNote"></div><button class="btn primary" onclick="addMember()">บันทึกสมาชิก</button></div><div class="card"><h2>รายชื่อสมาชิก</h2><div class="toolbar"><input id="memSearch" placeholder="ค้นหาชื่อ / เบอร์" oninput="renderMembers()"></div><div id="memberTable" class="scroll"></div></div></div></section>
<section id="catalog" class="page"><div class="card"><div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0">กรอบ & ราคา</h2><button class="btn primary mini" onclick="addFrame()">+ เพิ่มกรอบ</button></div><div id="framesEdit" class="section"></div></div><div class="card section"><h2>ค่าบริการ</h2><div id="servicesEdit"></div></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://yycczsqomrhndpxhncjr.supabase.co';
const SUPABASE_KEY='sb_publishable_gZnaEp5Zw0wlIe0sEOiW7Q_1DQGIT7R';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let currentUser=null,currentProfile=null,frames=[],services=[],members=[],jobs=[];
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active');if(b.dataset.p==='new')fillNew();});
function showErr(t,c='#b42318'){$('err').textContent=t;$('err').style.color=c}
async function signup(){showErr('');const email=$('u').value.trim(),password=$('p').value;if(!email||password.length<6)return showErr('กรุณาใส่อีเมลและรหัสผ่านอย่างน้อย 6 ตัวอักษร');const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:email.split('@')[0]}}});if(error)return showErr(error.message);if(data.session){showErr('สมัครสำเร็จ กำลังเข้าสู่ระบบ...','#067647');await enterApp(data.user)}else showErr('สมัครสำเร็จ กรุณาเช็กอีเมลเพื่อยืนยันบัญชี แล้วกลับมา Login','#067647')}
async function login(){showErr('');const {data,error}=await sb.auth.signInWithPassword({email:$('u').value.trim(),password:$('p').value});if(error)return showErr('Login ไม่สำเร็จ: '+error.message);await enterApp(data.user)}
async function logout(){await sb.auth.signOut();location.reload()}
async function enterApp(user){currentUser=user;const {data:profile}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();currentProfile=profile;$('login').classList.add('hide');$('app').classList.remove('hide');document.querySelector('.top b').textContent='FRAME POS · '+(profile?.role||'staff');await renderAll()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session?.user)await enterApp(session.user)}
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
function dt(s){if(!s)return '-';return new Date(s).toLocaleString('th-TH')}
async function loadData(){const [f,s,m,j]=await Promise.all([sb.from('frame_products').select('*').eq('active',true).order('sku'),sb.from('services').select('*').eq('active',true).order('name'),sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('jobs').select('*, customers(name,phone,member_tier), frame_products(sku,name,color)').order('created_at',{ascending:false})]);if(f.error||s.error||m.error||j.error){console.error(f.error,s.error,m.error,j.error);return}frames=f.data||[];services=s.data||[];members=m.data||[];jobs=j.data||[]}
async function renderAll(){await loadData();renderAllLocal()}
function renderAllLocal(){renderDash();renderMembers();renderJobs();renderCatalog();fillNew()}
function renderDash(){$('kJobs').textContent=jobs.length;$('kProd').textContent=jobs.filter(j=>!['picked_up','cancelled'].includes(j.status)).length;$('kMem').textContent=members.length;$('kSales').textContent=money(jobs.reduce((a,j)=>a+Number(j.total||0),0));$('recent').innerHTML=jobs.length?'<table><tr><th>Job</th><th>ลูกค้า</th><th>ยอด</th><th>สถานะ</th><th>นัดรับ</th></tr>'+jobs.slice(0,8).map(j=>`<tr><td>${j.job_no}</td><td>${j.customers?.name||'Walk-in'}</td><td>${money(j.total)}</td><td><span class="pill">${j.status}</span></td><td>${dt(j.promised_at)}</td></tr>`).join('')+'</table>':'ยังไม่มีงาน'}
function renderMembers(){let q=($('memSearch')?.value||'').toLowerCase();let x=members.filter(m=>(m.name+' '+(m.phone||'')).toLowerCase().includes(q));$('memberTable').innerHTML=x.length?'<table><tr><th>สมาชิก</th><th>โทร</th><th>ระดับ</th><th>ยอดใช้</th><th>วันที่สมัคร</th></tr>'+x.map(m=>`<tr><td><b>${m.name}</b><br><span class="muted">${m.member_no||''}</span></td><td>${m.phone||'-'}</td><td>${m.member_tier}</td><td>${money(m.total_spend)}</td><td>${dt(m.created_at)}</td></tr>`).join('')+'</table>':'ยังไม่มีสมาชิก'}
async function addMember(){let name=$('mName').value.trim();if(!name)return alert('กรุณาใส่ชื่อ');let no='M'+Date.now().toString().slice(-8);let {error}=await sb.from('customers').insert({member_no:no,name,phone:$('mPhone').value.trim()||null,email:$('mEmail').value.trim()||null,member_tier:$('mTier').value,notes:$('mNote').value.trim()||null});if(error)return alert(error.message);$('mName').value=$('mPhone').value=$('mEmail').value=$('mNote').value='';await renderAll();alert('เพิ่มสมาชิกแล้ว')}
function renderJobs(){let q=($('jobSearch')?.value||'').toLowerCase();let x=jobs.filter(j=>(j.job_no+' '+(j.customers?.name||'')+' '+(j.customers?.phone||'')).toLowerCase().includes(q));$('jobsTable').innerHTML=x.length?'<table><tr><th>Job</th><th>ลูกค้า</th><th>กรอบ</th><th>ยอด</th><th>มัดจำ</th><th>คงเหลือ</th><th>สถานะ</th><th>นัดรับ</th></tr>'+x.map(j=>`<tr><td><b>${j.job_no}</b><br><span class="muted">${dt(j.created_at)}</span></td><td>${j.customers?.name||'Walk-in'}</td><td>${j.frame_name_snapshot||'-'} ${j.frame_color_snapshot||''}</td><td>${money(j.total)}</td><td>${money(j.deposit)}</td><td>${money(j.balance)}</td><td><select onchange="setStatus('${j.id}',this.value)">${['received','production','ready','picked_up','cancelled'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${dt(j.promised_at)}</td></tr>`).join('')+'</table>':'ยังไม่มีงาน'}
async function setStatus(id,status){let {error}=await sb.from('jobs').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await sb.from('job_status_history').insert({job_id:id,status,changed_by:currentUser?.id});await loadData();renderAllLocal()}
function renderCatalog(){$('framesEdit').innerHTML=frames.map(f=>`<div class="editgrid"><input id="fc${f.id}" value="${f.sku}"><input id="fn${f.id}" class="wide" value="${f.name}"><input id="fco${f.id}" value="${f.color||''}"><input id="fr${f.id}" type="number" value="${f.price_per_meter}"><button class="btn light mini" onclick="saveFrame('${f.id}')">บันทึก</button></div>`).join('');$('servicesEdit').innerHTML=services.map(s=>`<div class="editgrid"><input value="${s.code}" disabled><input id="sn${s.id}" class="wide" value="${s.name}"><input value="${s.pricing_type}" disabled><input id="sr${s.id}" type="number" value="${s.price}"><button class="btn light mini" onclick="saveService('${s.id}')">บันทึก</button></div>`).join('')}
async function saveFrame(id){let payload={sku:$('fc'+id).value,name:$('fn'+id).value,color:$('fco'+id).value,price_per_meter:+$('fr'+id).value||0,updated_at:new Date().toISOString()};let {error}=await sb.from('frame_products').update(payload).eq('id',id);if(error)return alert(error.message);await loadData();renderAllLocal();alert('บันทึกราคาออนไลน์แล้ว')}
async function addFrame(){let {error}=await sb.from('frame_products').insert({sku:'NEW-'+Date.now().toString().slice(-5),name:'กรอบใหม่',color:'สีใหม่',price_per_meter:0});if(error)return alert(error.message);await loadData();renderAllLocal()}
async function saveService(id){let {error}=await sb.from('services').update({name:$('sn'+id).value,price:+$('sr'+id).value||0,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadData();renderAllLocal();alert('บันทึกค่าบริการออนไลน์แล้ว')}
function fillNew(){$('nCustomer').innerHTML='<option value="">Walk-in / ไม่เป็นสมาชิก</option>'+members.map(m=>`<option value="${m.id}">${m.name} · ${m.phone||'-'}</option>`).join('');$('nFrame').innerHTML=frames.map(f=>`<option value="${f.id}">${f.sku} · ${f.name} · ${f.color} · ${money(f.price_per_meter)}/m</option>`).join('');$('serviceList').innerHTML=services.map(s=>`<label class="svc"><input type="checkbox" class="nsvc" value="${s.id}" onchange="calc()"> ${s.name}<span>${s.pricing_type==='percent'?s.price+'%':money(s.price)}</span></label>`).join('');if(!$('nDue').value){let d=new Date(Date.now()+7*86400000);$('nDue').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}calc()}
function calc(){let f=frames.find(x=>x.id===$('nFrame').value);let w=+$('nW').value||0,h=+$('nH').value||0;let perimeter=2*(w+h)/100;let framePrice=perimeter*Number(f?.price_per_meter||0);let [glass]=($('nGlass').value||'0|').split('|'),[mat]=($('nMat').value||'0|').split('|'),[back]=($('nBack').value||'0|').split('|');let base=framePrice+(+glass)+(+mat)+(+back);let svcTotal=0;document.querySelectorAll('.nsvc:checked').forEach(c=>{let s=services.find(x=>x.id===c.value);if(!s)return;svcTotal+=s.pricing_type==='percent'?base*Number(s.price)/100:Number(s.price)});let sub=base+svcTotal,disc=+$('nDisc').value||0,total=Math.max(0,sub-disc),dep=+$('nDep').value||0,balance=Math.max(0,total-dep);window._quote={f,framePrice,sub,disc,total,dep,balance,w,h,perimeter,svcTotal};$('priceBox').innerHTML=`<div><span>ความยาวกรอบ</span><b>${perimeter.toFixed(2)} m</b></div><div><span>ค่ากรอบ</span><b>${money(framePrice)}</b></div><div><span>อุปกรณ์ + บริการ</span><b>${money(sub-framePrice)}</b></div><div><span>ส่วนลด</span><b>-${money(disc)}</b></div><div class="total"><span>รวม</span><b>${money(total)}</b></div><div><span>มัดจำ</span><b>${money(dep)}</b></div><div><span>คงเหลือ</span><b>${money(balance)}</b></div>`}
async function createJob(){calc();let q=window._quote;if(!q.f)return alert('ยังไม่มีกรอบในระบบ');let now=new Date(),jobNo='J'+now.getFullYear().toString().slice(-2)+(now.getMonth()+1).toString().padStart(2,'0')+now.getDate().toString().padStart(2,'0')+'-'+Date.now().toString().slice(-5);let glass=$('nGlass').value.split('|')[1],mat=$('nMat').value.split('|')[1],back=$('nBack').value.split('|')[1];let payload={job_no:jobNo,customer_id:$('nCustomer').value||null,width_cm:q.w,height_cm:q.h,frame_product_id:q.f.id,frame_sku_snapshot:q.f.sku,frame_name_snapshot:q.f.name,frame_color_snapshot:q.f.color,frame_price_snapshot:q.f.price_per_meter,glass_type:glass,mat_type:mat,backing_type:back,subtotal:q.sub,discount:q.disc,total:q.total,deposit:q.dep,balance:q.balance,status:'received',promised_at:$('nDue').value?new Date($('nDue').value).toISOString():null,notes:$('nNotes').value.trim()||null,created_by:currentUser?.id};let {data,error}=await sb.from('jobs').insert(payload).select().single();if(error)return alert(error.message);let checked=[...document.querySelectorAll('.nsvc:checked')];for(let c of checked){let s=services.find(x=>x.id===c.value);let amount=s.pricing_type==='percent'?(q.sub-q.svcTotal)*Number(s.price)/100:Number(s.price);await sb.from('job_services').insert({job_id:data.id,service_id:s.id,service_name_snapshot:s.name,qty:1,unit_price_snapshot:s.price,amount})}if(q.dep>0)await sb.from('payments').insert({job_id:data.id,amount:q.dep,method:'deposit',received_by:currentUser?.id});if(payload.customer_id)await sb.from('customer_visits').insert({customer_id:payload.customer_id,visit_type:'order',job_id:data.id,created_by:currentUser?.id});await sb.from('job_status_history').insert({job_id:data.id,status:'received',changed_by:currentUser?.id});$('nNotes').value='';$('nDep').value='0';$('nDisc').value='0';await renderAll();alert('เปิด Job '+jobNo+' แล้ว')}
boot();
</script></body></html>
